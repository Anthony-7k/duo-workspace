function detail(x){if(x.status==='维修中')return '设备维修中';if(x.status==='已用完')return x.location||'未设置位置';const d=days(x);if(d!==null&&d<=30)return (x.category==='digital'?'保修':'有效期')+(d<0?'已到期':d===0?'今日到期':'剩余 '+d+' 天');return x.location||'未设置位置';}

function restore(s){const p=s?.privateContent;if(p?.schema!=='pearl-v1')return;if(Array.isArray(p.items)&&p.items.length<=24&&p.items.every(x=>x&&typeof x.name==='string'&&['digital','beauty'].includes(x.category)))items=p.items;for(const x of p.views||[]){if(!x||typeof x.key!=='string')continue;configs[x.key]=x;}}

$('.dp-mount').append(document.getElementById('dp-management').content.cloneNode(true));

$$('.dp-attn-count').forEach(n=>n.textContent=counts.attention);

})();

const root=document.getElementById('duo-pearl'),app=root.querySelector('.dp-app');
const NS='http://www.w3.org/2000/svg';
const svg=document.createElementNS(NS,'svg');svg.classList.add('pearl-filter-defs');svg.setAttribute('aria-hidden','true');const defs=document.createElementNS(NS,'defs');svg.append(defs);root.append(svg);
const settings={refraction:40,shine:22,softness:.2};
let nextId=0,filterEntries=[],frame=null;
function node(tag,attrs){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));return n;}
function displacement(w,h,r){
const ratio=Math.min(1,500/w),cw=Math.max(1,Math.round(w*ratio)),ch=Math.max(1,Math.round(h*ratio));
const c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d'),img=ctx.createImageData(cw,ch);const band=Math.min(29,r*.95);
for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
const px=(x+.5)/ratio-w/2,py=(y+.5)/ratio-h/2;
const qx=Math.abs(px)-(w/2-r),qy=Math.abs(py)-(h/2-r),ax=Math.max(qx,0),ay=Math.max(qy,0),length=Math.hypot(ax,ay);
const d=-(length+Math.min(Math.max(qx,qy),0)-r);
let nx=0,ny=0;if(length>.001){nx=ax/length*Math.sign(px);ny=ay/length*Math.sign(py);}else if(qx>qy)nx=Math.sign(px);else ny=Math.sign(py);
const t=Math.max(0,Math.min(1,d/band));const rim=d>=0&&d<band?Math.pow(Math.sin(Math.PI*t),1.4)*.85:0;
const centerZoom=d>0?.025:0;
const red=128-nx*rim*110-px/w*centerZoom*255,green=128-ny*rim*110-py/h*centerZoom*255;
const i=(y*cw+x)*4;img.data[i]=Math.max(0,Math.min(255,red));img.data[i+1]=Math.max(0,Math.min(255,green));img.data[i+2]=128;img.data[i+3]=255;
}ctx.putImageData(img,0,0);return c.toDataURL();
}
function updateEntry(entry){const {el,filter,image,warp,blur}=entry;const b=el.getBoundingClientRect();if(!b.width||!b.height)return;const w=Math.round(b.width),h=Math.round(b.height),radius=Math.min(w/2,h/2,parseFloat(getComputedStyle(el).borderTopLeftRadius)||22);const key=w+':'+h+':'+radius;
if(entry.key!==key){filter.setAttribute('width',w);filter.setAttribute('height',h);image.setAttribute('width',w);image.setAttribute('height',h);image.setAttribute('href',displacement(w,h,radius));entry.key=key;}
warp.setAttribute('scale',el.classList.contains('pearl-summary')?settings.refraction*.85:settings.refraction*1.1);blur.setAttribute('stdDeviation',settings.softness);
el.style.backdropFilter=`url(#${filter.id}) saturate(.9)`;el.style.webkitBackdropFilter=`url(#${filter.id}) saturate(.9)`;
}
function attach(el){if(el.dataset.liquidBound)return;el.dataset.liquidBound='true';el.classList.add('pearl-refraction');const id='duo-pearl-optics-'+(++nextId);const f=node('filter',{id,filterUnits:'userSpaceOnUse',primitiveUnits:'userSpaceOnUse',x:0,y:0,width:200,height:100,'color-interpolation-filters':'sRGB'});const image=node('feImage',{x:0,y:0,width:200,height:100,preserveAspectRatio:'none',result:'lens-map'});const warp=node('feDisplacementMap',{in:'SourceGraphic',in2:'lens-map',scale:36,xChannelSelector:'R',yChannelSelector:'G',result:'bent-glass'});const blur=node('feGaussianBlur',{in:'bent-glass',stdDeviation:.3});f.append(image,warp,blur);defs.append(f);const e={el,filter:f,image,warp,blur,key:''};filterEntries.push(e);observer.observe(el);updateEntry(e);}
function queue(){if(frame!==null)return;frame=requestAnimationFrame(()=>{frame=null;filterEntries.forEach(updateEntry)});}
const observer=new ResizeObserver(queue);
function scan(){filterEntries=filterEntries.filter(e=>{if(e.el.isConnected)return true;observer.unobserve(e.el);e.filter.remove();return false});root.querySelectorAll('.pearl-nav,.pearl-summary,.dp-toolbar,.dp-product,.dp-primary').forEach(attach);queue();}
scan();new MutationObserver(scan).observe(root.querySelector('.dp-management'),{childList:true,subtree:true});
root.addEventListener('pointermove',e=>{const el=e.target.closest('.dp-product,.pearl-summary,.pearl-nav,.dp-toolbar');if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty('--px',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');el.style.setProperty('--py',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');});
function tune(){filterEntries.forEach(updateEntry);root.style.setProperty('--pearl-shine',settings.shine/100);}
if(globalThis.Tweak){const t=new Tweak({container:app,onChange:tune});t.addSlider(settings,'refraction',{label:'玻璃折射强度',min:10,max:60,unit:'px'});t.addSlider(settings,'shine',{label:'镜面高光',min:20,max:95,unit:'%'});t.addSlider(settings,'softness',{label:'玻璃柔化',min:0,max:3,step:.1,unit:'px'});}
})();

</script>
